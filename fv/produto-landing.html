<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FV Enxovais · 4 · Produto com landing page</title>
<link rel="icon" href="assets/symbol.svg">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>#fv-root{min-height:100vh}</style>
</head>
<body data-pagina="produto-landing" data-titulo="4 · Produto com landing page">
<div id="fv-root"></div>
<template id="fv-tpl-ProdutoLP">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
</style>
</helmet>
<div style="width: 100%;">
  <dc-import name="Produto" lp="{{yes}}" hint-size="100%,6400px"></dc-import>
</div>
</template>
<script type="text/plain" id="fv-js-ProdutoLP">
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
<template id="fv-tpl-Produto">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#243b49}a:hover{color:#806375}
@keyframes fvmarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.fv-marquee-track{animation:fvmarquee 28s linear infinite}
@keyframes fvreveal{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes fvpar{from{transform:scale(1.14) translateY(-5%)}to{transform:scale(1) translateY(5%)}}
@keyframes fvslide{from{transform:translateX(100%)}to{transform:none}}
@supports (animation-timeline: view()){
.fv-reveal{animation:fvreveal linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
.fv-par{animation:fvpar linear both;animation-timeline:view()}
}
.fv-drawer{animation:fvslide .28s ease-out}
@keyframes fvkb{from{transform:scale(1)}to{transform:scale(1.18)}}
.fv-kb{animation:fvkb 6s ease-in-out infinite alternate}
@keyframes fvprog{from{width:0}to{width:100%}}
.fv-prog{animation:fvprog 6s linear infinite}
.fv-hscroll{scrollbar-width:none}
.fv-hscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="font-family: var(--font-brand); color: #243b49; background: #ffffff; min-width: 320px;">

<!-- Faixa rolante -->
<div style="background: #243b49; color: #ffffff; overflow: hidden; height: 38px; display: flex; align-items: center;">
  <div class="fv-marquee-track" style="display: flex; gap: 56px; white-space: nowrap; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding-left: 56px;">
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
  </div>
</div>

<!-- Header -->
<header style="border-bottom: 1px solid #e8e1de; background: #ffffff;">
  <div style="max-width: none; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px;">
    <button aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <a href="home.html" style="display: flex; align-items: center;"><img src="assets/logo-horizontal.svg" alt="FV Enxovais — início" style="height: 44px; width: auto; display: block;"></a>
    <nav style="flex: 999 1 520px; display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 500;">
      <a href="colecao.html" style="text-decoration: none; padding: 10px 0;">Cama</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Travesseiros</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Mantas e Cobertores</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Tapetes e Decoração</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Kids</a>
      <a href="#" style="text-decoration: none; padding: 10px 0; color: #806375; font-weight: 700;">Kits e Ofertas</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
      <button aria-label="Buscar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
      <button aria-label="Abrir carrinho" onClick="{{openCart}}" style="position: relative; width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg>
        <sc-if value="{{hasCart}}" hint-placeholder-val="{{no}}">
          <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 999px; background: #806375; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{cartCount}}</span>
        </sc-if>
      </button>
    </div>
  </div>
</header>

<!-- Breadcrumb -->
<div style="max-width: none; margin: 0 auto; padding: 10px 24px 0; font-size: 13px; color: #55687a; display: flex; gap: 8px; flex-wrap: wrap;">
  <a href="home.html" style="color: #55687a;">Início</a><span aria-hidden="true">/</span><a href="colecao.html" style="color: #55687a;">Cama</a><span aria-hidden="true">/</span><a href="colecao.html" style="color: #243b49;">Jogos de cama</a>
</div>

<!-- ÁREA DE COMPRA -->
<section style="max-width: none; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: flex-start;">

  <!-- Galeria quadrada 1:1 (fotos 1200 × 1200), fixa enquanto a coluna da direita rola -->
  <div style="flex: 999 1 560px; min-width: 0; position: sticky; top: 16px; display: flex; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 10px; flex: none;">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="5">
        <button aria-label="{{t.label}}" onClick="{{t.pick}}" style="width: 80px; height: 80px; padding: 0; border-radius: 10px; cursor: pointer; background: {{t.bg}}; {{t.ring}}"></button>
      </sc-for>
    </div>
    <div style="position: relative; flex: 1; min-width: 0; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: {{slide.bg}};">
      <sc-if value="{{slide.isCover}}" hint-placeholder-val="{{yes}}">
        <div style="position: absolute; left: 16%; right: 16%; top: 38%; height: 16%; border-radius: 12px; background: {{color}}; opacity: 0.85; box-shadow: 0 12px 26px rgba(36,59,73,0.10);"></div>
        <div style="position: absolute; left: 12%; right: 12%; top: 51%; height: 19%; border-radius: 12px; background: {{color}}; box-shadow: 0 16px 34px rgba(36,59,73,0.14);"></div>
      </sc-if>
      <sc-if value="{{slide.isPhoto}}" hint-placeholder-val="{{no}}">
        <img src="assets/symbol.svg" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 26%; transform: translate(-50%, -50%); opacity: 0.14;">
      </sc-if>
      <span style="position: absolute; left: 14px; bottom: 14px; right: 70px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 10px;">{{slide.label}}</span>
      <span class="fv-badge fv-badge--best" style="position: absolute; top: 14px; left: 14px;">Mais vendido</span>
      <!-- Vídeo flutuante (prévia silenciosa) -->
      <sc-if value="{{floatOn}}" hint-placeholder-val="{{yes}}">
        <div style="position: absolute; top: 16px; right: 16px; width: 124px; z-index: 3;">
          <button aria-label="Ver os 4 vídeos de quem usa este produto" onClick="{{openVideos}}" style="position: relative; display: block; width: 124px; aspect-ratio: 9 / 16; border: 3px solid #ffffff; border-radius: 16px; padding: 0; overflow: hidden; cursor: pointer; background: #e9dcd9; box-shadow: 0 12px 30px rgba(36,59,73,0.30);">
            <span class="fv-kb" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;"><img src="assets/symbol.svg" alt="" aria-hidden="true" style="width: 46%; opacity: 0.2;"></span>
            <span style="position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 999px; background: rgba(36,59,73,0.7); color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l4 6M21 9l-4 6"></path></svg></span>
            <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px 11px; background: rgba(36,59,73,0.78); color: #ffffff; font-size: 11px; font-weight: 600; text-align: left; display: flex; align-items: center; gap: 5px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Quem usa · 4 vídeos</span>
            <span class="fv-prog" style="position: absolute; left: 0; bottom: 0; height: 3px; background: #e7c8c6;"></span>
          </button>
          <button aria-label="Fechar vídeo" onClick="{{closeFloat}}" style="position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; border-radius: 999px; border: 2px solid #ffffff; background: #243b49; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </sc-if>
      <button aria-label="Foto anterior" onClick="{{prev}}" style="position: absolute; left: 12px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.92); color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <button aria-label="Próxima foto" onClick="{{next}}" style="position: absolute; right: 12px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.92); color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <span style="position: absolute; right: 14px; bottom: 14px; font-size: 12px; font-weight: 600; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 999px; padding: 6px 10px;">{{slideCount}}</span>
    </div>
  </div>

  <!-- Coluna de compra -->
  <div style="flex: 1 1 420px; min-width: 0; max-width: 540px; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span class="fv-badge" style="background: #806375; color: #ffffff;">Mais vendido</span>
        <a href="colecao.html" style="font-size: 13px; font-weight: 600; color: #806375; text-decoration: none;">3º mais vendido em Jogos de cama</a>
      </div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600;">Jogo de Cama 4 Peças Toque de Seda</h1>
      <a href="#avaliacoes" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #55687a; text-decoration: none;">
        <b style="color: #243b49; font-size: 15px;">4,8</b>
        <span style="color: #806375; letter-spacing: 1px; font-size: 16px;" aria-label="Nota 4,8 de 5">★★★★★</span>
        <span>(<u>312 avaliações</u>)</span>
      </a>
    </div>

    <!-- Bloco de preço -->
    <div style="border: 2px solid #e7c8c6; border-radius: 16px; overflow: hidden; background: #fffaf9;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 18px; background: #e7c8c6; color: #243b49; font-size: 13px; font-weight: 700;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>
        Parcelado sem juros em até 6x
      </div>
      <div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 14px; color: #55687a; text-decoration: line-through;">{{oldPrice}}</span>
        <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
          <span style="font-size: 40px; line-height: 1.1; font-weight: 700;">{{price}}</span>
          <span style="font-size: 16px; font-weight: 700; color: #2f6b4f;">{{discountOff}}</span>
        </div>
        <span style="font-size: 15px; color: #243b49;">em <b>{{inst}}</b> sem juros</span>
        <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #0e7c72; color: #ffffff;">
          <span style="width: 42px; height: 42px; flex: none; border-radius: 10px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M8.5 12h7"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 25px; line-height: 1.1; font-weight: 700;">{{pix}} <span style="font-size: 15px; font-weight: 600;">no Pix</span></span>
            <span style="font-size: 13px; opacity: 0.92;">Pagamento na hora, aprovação imediata</span>
          </span>
          <span style="flex: none; padding: 6px 10px; border-radius: 999px; background: #ffffff; color: #0e7c72; font-size: 13px; font-weight: 700; white-space: nowrap;">−{{pixSave}}</span>
        </div>
        <a href="#" style="margin-top: 10px; font-size: 13px; font-weight: 600; color: #806375;">Ver formas de pagamento</a>
      </div>
    </div>

    <!-- Captura: cupom extra -->
    <button onClick="{{capToggle}}" aria-pressed="{{capPressed}}" style="width: 100%; text-align: left; font-family: inherit; color: #243b49; cursor: pointer; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; {{capBoxStyle}}">
      <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; {{capCheckStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px;"><b>Quero meu cupom: +5% OFF</b> na primeira compra</span>
        <span style="font-size: 13px; color: #4e6170;">{{capHint}}</span>
      </span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; color: #55687a;">Cor: <b style="color: #243b49;">{{colorName}}</b></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="5">
          <button aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 56px; height: 56px; padding: 4px; border-radius: 10px; cursor: pointer; background: #ffffff; {{c.ring}}">
            <span style="display: block; width: 100%; height: 100%; border-radius: 7px; background: {{c.hex}}; box-shadow: inset 0 0 0 1px rgba(36,59,73,0.12);"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; color: #55687a;">Tamanho: <b style="color: #243b49;">{{sizeName}}</b> <a href="#medidas" style="margin-left: 8px; font-weight: 600; color: #806375;">Qual é o meu tamanho?</a></span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
          <button class="fv-chip" aria-pressed="{{s.pressed}}" aria-disabled="{{s.disabled}}" onClick="{{s.pick}}" style="font-family: inherit; min-width: 0;">{{s.label}}<small>{{s.sub}}</small></button>
        </sc-for>
      </div>
    </div>

    <!-- Frete por CEP -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <label for="cep" style="font-size: 14px; font-weight: 600;">Calcule o frete e o prazo</label>
      <div style="display: flex; gap: 8px;">
        <input id="cep" inputmode="numeric" placeholder="00000-000" value="{{cep}}" onChange="{{onCep}}" style="flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1.5px solid #788fa1; border-radius: 8px; font-family: inherit; font-size: 16px; color: #243b49;">
        <button class="fv-btn fv-btn--secondary" onClick="{{calcShip}}" style="font-family: inherit;">Calcular</button>
      </div>
      <sc-if value="{{shipShown}}" hint-placeholder-val="{{no}}">
        <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #e8e1de; border-radius: 8px;">
          <sc-for list="{{shipOptions}}" as="o" hint-placeholder-count="2">
            <li style="display: flex; justify-content: space-between; gap: 12px; padding: 12px; font-size: 14px; border-bottom: 1px solid #e8e1de;"><span>{{o.name}}</span><span style="font-weight: 700; {{o.style}}">{{o.price}}</span></li>
          </sc-for>
        </ul>
      </sc-if>
    </div>

    <sc-if value="{{available}}" hint-placeholder-val="{{yes}}">
      <button class="fv-btn fv-btn--primary fv-btn--block" onClick="{{addToCart}}" style="font-family: inherit; min-height: 60px; font-size: 18px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg>
        Adicionar ao carrinho
      </button>
    </sc-if>
    <sc-if value="{{unavailable}}" hint-placeholder-val="{{no}}">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="fv-btn fv-btn--secondary fv-btn--block" style="font-family: inherit; min-height: 60px;">Avise-me no WhatsApp quando chegar</button>
        <span style="font-size: 13px; color: #a3362e;">Marinho no tamanho King está esgotado no momento.</span>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 13px; color: #243b49;">
      <span style="display: flex; gap: 8px; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#806375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"></path><circle cx="7" cy="17.5" r="1.6"></circle><circle cx="17.5" cy="17.5" r="1.6"></circle></svg>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span>
      <span style="display: flex; gap: 8px; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#806375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5"></path></svg>Troca fácil</span>
      <span style="display: flex; gap: 8px; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#806375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Compra segura</span>
      <span style="display: flex; gap: 8px; align-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#806375" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>Direto da fábrica</span>
    </div>

    <!-- Acordeões -->
    <div id="medidas" style="display: flex; flex-direction: column; border-top: 1px solid #e8e1de;">
      <sc-for list="{{accordion}}" as="a" hint-placeholder-count="4">
        <div style="border-bottom: 1px solid #e8e1de;">
          <button aria-expanded="{{a.expanded}}" onClick="{{a.toggle}}" style="width: 100%; min-height: 56px; display: flex; justify-content: space-between; align-items: center; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #243b49; cursor: pointer; text-align: left;">{{a.title}}<span aria-hidden="true" style="font-size: 22px; font-weight: 400;">{{a.sign}}</span></button>
          <sc-if value="{{a.open}}" hint-placeholder-val="{{no}}">

<script type="text/plain" id="fv-js-Produto">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { color: 0, size: 1, slide: 0, acc: -1, cep: '', ship: false, cartOpen: false, cart: [], floatOn: true, videosOpen: false, vid: 0, cap: 0, up: 0 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
    var colorDefs = [
      { name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Areia', hex: '#c7b9b0' }, { name: 'Azul Bebê', hex: '#a9cfe6' },
      { name: 'Branco', hex: '#ffffff' }, { name: 'Marinho', hex: '#243b49' }
    ];
    var sizeDefs = [
      { label: 'Casal', sub: '138 × 188 cm', price: 169.9, old: 229.9, w: '138', l: '188' },
      { label: 'Queen', sub: '158 × 198 cm', price: 189.9, old: 249.9, w: '158', l: '198' },
      { label: 'King', sub: '193 × 203 cm', price: 219.9, old: 289.9, w: '193', l: '203' }
    ];
    var col = colorDefs[st.color];
    var sz = sizeDefs[st.size];
    var soldOut = function (ci, si) { return ci === 4 && si === 2; };
    var available = !soldOut(st.color, st.size);

    var slides = [
      { label: 'Capa 1200 × 1200 · produto dobrado, fundo off-white', bg: '#f6f2ee', isCover: true },
      { label: 'Cama montada, sol da manhã', bg: '#ead8d6', isCover: false },
      { label: 'Close da textura do tecido', bg: '#ebe5e1', isCover: false },
      { label: 'Lençol de elástico vestindo o colchão', bg: '#e6e9ec', isCover: false },
      { label: 'Etiqueta e embalagem', bg: '#efe9e4', isCover: false }
    ];
    var si = st.slide;
    var slide = { label: slides[si].label, bg: slides[si].bg, isCover: slides[si].isCover, isPhoto: !slides[si].isCover };
    var thumbs = slides.map(function (s, i) {
      return {
        label: 'Ver foto ' + (i + 1),
        bg: i === 0 ? col.hex : s.bg,
        ring: i === si ? 'border: 2px solid #806375;' : 'border: 1px solid #e8e1de;',
        pick: function () { self.setState({ slide: i }); }
      };
    });

    var colors = colorDefs.map(function (c, i) {
      return {
        name: c.name, hex: c.hex, pressed: i === st.color ? 'true' : 'false',
        ring: i === st.color ? 'border: 2px solid #806375;' : 'border: 1.5px solid #e8e1de;',
        pick: function () { self.setState({ color: i, slide: 0 }); }
      };
    });
    var sizes = sizeDefs.map(function (s, i) {
      var out = soldOut(st.color, i);
      return {
        label: s.label, sub: out ? 'esgotado' : s.sub,
        pressed: i === st.size ? 'true' : 'false', disabled: out ? 'true' : 'false',
        pick: function () { self.setState({ size: i }); }
      };
    });

    var price = sz.price;
    // Frete grátis por região (pelo 1º dígito do CEP): Sul e Sudeste R$ 199; Centro-Oeste, Norte e Nordeste R$ 249
    var cepDigits = (st.cep || '').replace(/\D/g, '');
    var hasCep = cepDigits.length === 8;
    var southSE = hasCep ? '012389'.indexOf(cepDigits.charAt(0)) >= 0 : true;
    var FREE_R = southSE ? 199 : 249;
    var shipOptions = [
      { name: 'Econômico · 5 a 8 dias úteis', price: price >= FREE_R ? 'Grátis' : 'R$ 18,90', style: price >= FREE_R ? 'color:#2f6b4f;' : '' },
      { name: 'Expresso · 2 a 4 dias úteis', price: 'R$ 29,90', style: '' }
    ];

    var accDefs = [
      { title: 'Detalhes do produto', body: 'Jogo de cama 4 peças em tecido [composição], toque acetinado.\nCor: ' + col.name + '. Tamanho: ' + sz.label + '.' },
      { title: 'Medidas', body: 'Lençol de elástico: ' + sz.w + ' × ' + sz.l + ' × [X] cm\nLençol de cima: [medida]\nFronhas: 2 × 50 × 70 cm\nServe em colchões de até [X] cm de altura.' },
      { title: 'Lavagem e cuidados', body: 'Lavar à máquina em água fria, com cores parecidas.\nNão usar alvejante. Secar à sombra.' },
      { title: 'Trocas e devoluções', body: 'Troca fácil: [prazo e condições da política FV].' }
    ];
    var accordion = accDefs.map(function (a, i) {
      var open = i === st.acc;
      return { title: a.title, body: a.body, open: open, expanded: open ? 'true' : 'false', sign: open ? '−' : '+', toggle: function () { self.setState({ acc: open ? -1 : i }); } };
    });

    // Carrinho
    var upsellPrice = 69.9;
    var cart = st.cart;
    var subtotal = 0, count = 0;
    var cartLines = cart.map(function (l, i) {
      subtotal += l.unit * l.qty; count += l.qty;
      var t = l.unit * l.qty;
      return {
        name: l.name, variant: l.variant, color: l.color, qty: l.qty, total: brl(t),
        old: l.old ? brl(l.old * l.qty) : '',
        pix: brl(Math.floor(t * 95) / 100),
        remove: function () { var c = self.state.cart.slice(); c.splice(i, 1); self.setState({ cart: c }); },
        inc: function () { var c = self.state.cart.slice(); c[i] = Object.assign({}, c[i], { qty: c[i].qty + 1 }); self.setState({ cart: c }); },
        dec: function () { var c = self.state.cart.slice(); if (c[i].qty > 1) { c[i] = Object.assign({}, c[i], { qty: c[i].qty - 1 }); } else { c.splice(i, 1); } self.setState({ cart: c }); }
      };
    });
    var hasUpsell = cart.some(function (l) { return l.id === 'softy'; });
    var FREE = FREE_R, GIFT = 299;
    var missing = FREE - subtotal;
    var upAll = [
      { id: 'softy', name: 'Kit 2 Travesseiros Softy 50 × 70', variant: 'Branco · 50 × 70 cm', color: '#f4f1ee', unit: 69.9, old: 79.9 },
      { id: 'fronhas', name: 'Par de Fronhas Toque de Seda 50 × 70', variant: 'Rosa Blush', color: '#e7c8c6', unit: 29.9, old: 39.9 },
      { id: 'saia', name: 'Saia Box Matelada Queen', variant: 'Branco · Queen', color: '#ffffff', unit: 79.9, old: 89.9 }
    ];
    var upList = upAll.filter(function (u) { return !cart.some(function (l) { return l.id === u.id; }); });
    var upI = upList.length ? st.up % upList.length : 0;
    var upItem = upList[upI];
    var tierPctNum = Math.min(100, subtotal / FREE * 100);
    var addToCart = function () {
      var key = 'jogo-' + st.color + '-' + st.size;
      var c = self.state.cart.slice();
      var idx = c.findIndex(function (l) { return l.id === key; });
      if (idx >= 0) { c[idx] = Object.assign({}, c[idx], { qty: c[idx].qty + 1 }); }
      else { c.push({ id: key, name: 'Jogo de Cama 4 Peças Toque de Seda', variant: col.name + ' · ' + sz.label, color: col.hex, unit: price, old: sz.old, qty: 1 }); }
      self.setState({ cart: c, cartOpen: true, videosOpen: false });
    };

    return {
      yes: true, no: false,
      lp: this.props.lp ?? false,
      color: col.hex, colorName: col.name, sizeName: sz.label,
      colors: colors, sizes: sizes, thumbs: thumbs, slide: slide,
      slideCount: (si + 1) + ' / ' + slides.length,
      prev: function () { self.setState({ slide: (si + slides.length - 1) % slides.length }); },
      next: function () { self.setState({ slide: (si + 1) % slides.length }); },
      oldPrice: brl(sz.old), price: brl(price),
      discount: '-' + Math.round((1 - price / sz.old) * 100) + '%',
      discountOff: Math.round((1 - price / sz.old) * 100) + '% OFF',
      pixSave: brl(price - Math.floor(price * 0.95 * 100) / 100),
      floatOn: st.floatOn,
      closeFloat: function () { self.setState({ floatOn: false }); },
      openVideos: function () { self.setState({ videosOpen: true }); },
      closeVideos: function () { self.setState({ videosOpen: false }); },
      videosOpen: st.videosOpen,
      vids: ['#e9dcd9', '#e4e9ec', '#e6ded7', '#ebe3dd'].map(function (bg, i) {
        var on = i === st.vid;
        return { bg: bg, label: 'Vídeo ' + (i + 1), pressed: on ? 'true' : 'false', status: on ? 'Reproduzindo com som' : 'Toque para assistir', ring: on ? 'border: 3px solid #806375;' : 'border: 3px solid transparent;', pick: function () { self.setState({ vid: i }); } };
      }),
      capPressed: st.cap ? 'true' : 'false',
      capToggle: function () { self.setState({ cap: self.state.cap ? 0 : 1 }); },
      capBoxStyle: st.cap ? 'background: #fbf6f5; border: 2px solid #806375;' : 'background: #ecf7fd; border: 2px dashed #788fa1;',
      capCheckStyle: st.cap ? 'background: #806375; border: 2px solid #806375;' : 'background: #ffffff; border: 2px solid #788fa1;',
      capHint: st.cap ? 'Cupom garantido! No Pix fica ' + brl(Math.floor(Math.floor(price * 0.95 * 100) / 100 * 0.95 * 100) / 100) + '. O desconto entra no checkout ao informar o e-mail da sua primeira compra.' : 'Marque para garantir. O desconto é aplicado no checkout.',
      pix: brl(Math.floor(price * 0.95 * 100) / 100),
      inst: '6x de ' + brl(Math.ceil(price / 6 * 100) / 100),
      available: available, unavailable: !available,
      cep: st.cep,
      onCep: function (e) { self.setState({ cep: e.target.value }); },
      calcShip: function () { self.setState({ ship: true }); },
      shipShown: st.ship, shipOptions: shipOptions,
      videos: ['#e9dcd9', '#e4e9ec', '#e6ded7', '#ebe3dd'],
      accordion: accordion,
      benefits: [
        { title: 'Macio desde a primeira noite', text: '[Benefício principal do tecido, em linguagem simples.]' },
        { title: 'Não amassa fácil', text: '[Benefício de praticidade: tira da secadora e já arruma a cama.]' },
        { title: 'Cor que dura', text: '[Benefício de durabilidade após as lavagens.]' }
      ],
      kitPieces: [
        { name: '1 lençol de elástico', size: sz.w + ' × ' + sz.l + ' × [X] cm' },
        { name: '1 lençol de cima', size: '[medida]' },
        { name: '2 fronhas', size: '50 × 70 cm' }
      ],
      care: [
        { title: 'Água fria', text: 'Lave na máquina, com cores parecidas.' },
        { title: 'Sem alvejante', text: 'Preserva a cor e o toque do tecido.' },
        { title: 'Secar à sombra', text: 'Evita que a cor desbote com o sol.' },
        { title: 'Ferro morno', text: 'Se quiser, em temperatura baixa.' }
      ],
      bars: [{ n: 5, w: '86%' }, { n: 4, w: '10%' }, { n: 3, w: '3%' }, { n: 2, w: '1%' }, { n: 1, w: '0%' }],
      reviews: [
        { bg: '#ead8d6', meta: '[Nome] · ' + 'Queen · Rosa Blush · compra verificada' },
        { bg: '#e6e9ec', meta: '[Nome] · Casal · Azul Bebê · compra verificada' },
        { bg: '#ebe5e1', meta: '[Nome] · King · Areia · compra verificada' }
      ],
      related: [
        { name: 'Kit 2 Travesseiros Softy 50 × 70', rating: '4,9', reviews: '88', colors: [{ name: 'Branco', hex: '#f4f1ee' }], more: '', old: '', price: 'R$ 79,90', pix: 'R$ 75,90', inst: '3x de R$ 26,63', tag: 'Novo', tagClass: 'fv-badge--new' },
        { name: 'Edredom Dupla Face Queen', rating: '4,7', reviews: '148', colors: [{ name: 'Areia', hex: '#c7b9b0' }, { name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Cinza', hex: '#b9b9bd' }], more: '', old: 'R$ 279,90', price: 'R$ 229,90', pix: 'R$ 218,40', inst: '6x de R$ 38,32', tag: '-18%', tagClass: 'fv-badge--promo' },
        { name: 'Manta Flannel Queen Toque Aveludado', rating: '4,7', reviews: '54', colors: [{ name: 'Avelã', hex: '#a28f80' }, { name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Marinho', hex: '#243b49' }], more: '+4 cores', old: '', price: 'R$ 119,90', pix: 'R$ 113,90', inst: '4x de R$ 29,98', tag: '', tagClass: '' },
        { name: 'Saia Box Matelada Queen', rating: '4,6', reviews: '33', colors: [{ name: 'Branco', hex: '#ffffff' }, { name: 'Areia', hex: '#c7b9b0' }], more: '', old: '', price: 'R$ 89,90', pix: 'R$ 85,40', inst: '3x de R$ 29,97', tag: '', tagClass: '' }
      ],
      cartOpen: st.cartOpen,
      openCart: function () { self.setState({ cartOpen: true }); },
      closeCart: function () { self.setState({ cartOpen: false }); },
      addToCart: addToCart,
      cartLines: cartLines,
      cartCount: count,
      hasCart: count > 0,
      hasUpsellItem: !!upItem,
      up: upItem ? {
        name: upItem.name, color: upItem.color, price: brl(upItem.unit), old: brl(upItem.old),
        off: Math.round((1 - upItem.unit / upItem.old) * 100) + '% OFF',
        add: function () { var c = self.state.cart.slice(); c.push({ id: upItem.id, name: upItem.name, variant: upItem.variant, color: upItem.color, unit: upItem.unit, old: upItem.old, qty: 1 }); self.setState({ cart: c }); }
      } : {},
      upCount: upList.length ? (upI + 1) + ' / ' + upList.length : '',
      upPrev: function () { self.setState({ up: (upI + upList.length - 1) % Math.max(upList.length, 1) }); },
      upNext: function () { self.setState({ up: (upI + 1) % Math.max(upList.length, 1) }); },
      tierMsgA: subtotal < FREE ? 'Faltam ' + brl(FREE - subtotal) + ' para ganhar ' : 'Oba! Você ganhou ',
      tierMsgB: 'frete grátis',
      tierMsgC: subtotal < FREE ? (hasCep ? '' : ' no Sul e Sudeste') : '!',
      tier1Left: 'left: 100%;',
      freeLabel: brl(FREE).replace(',00', ''),
      needCep: !hasCep,
      hasCep: hasCep,
      regionNote: hasCep ? (southSE ? 'CEP ' + st.cep + ' · Sul e Sudeste: frete grátis a partir de R$ 199' : 'CEP ' + st.cep + ' · Centro-Oeste, Norte e Nordeste: frete grátis a partir de R$ 249') : '',
      tierPct: tierPctNum + '%',
      tier1Dot: 'left: 100%; ' + (subtotal >= FREE ? 'background: #806375; color: #ffffff;' : 'background: #ffffff; color: #788fa1; box-shadow: inset 0 0 0 2px #e8e1de;'),
      tier2Dot: 'display: none;',
      hasCoupon: !!st.cap,
      pixDisc: brl(subtotal - Math.floor(subtotal * 95) / 100),
      freteLabel: subtotal >= FREE ? 'Grátis' : 'Calculado no checkout',
      freteStyle: subtotal >= FREE ? 'color: #2f6b4f; font-weight: 700;' : 'color: #55687a;',
      subtotal: brl(subtotal),
      subtotalPix: brl(Math.floor(subtotal * 0.95 * 100) / 100),
      subtotalInst: '6x de ' + brl(Math.ceil(subtotal / 6 * 100) / 100)
    };
  }
}
</script>

<script type="text/plain" id="fv-js-ProductCard">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    var self = this;
    var item = this.props.item || {
      name: 'Jogo de Cama Queen 4 Peças Toque de Seda', rating: '4,8', reviews: '312',
      colors: [{ name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Areia', hex: '#c7b9b0' }, { name: 'Azul Bebê', hex: '#a9cfe6' }, { name: 'Marinho', hex: '#243b49' }],

    };
    var colors = item.colors || [];
    var sel = Math.min(this.state.sel, Math.max(colors.length - 1, 0));
    var large = this.props.large ?? false;
    var tile = this.props.tile ?? false;
    var swatches = colors.slice(0, 4).map(function (c, i) {
      var on = i === sel;
      return {
        name: c.name,
        hex: c.hex,
        pressed: on ? 'true' : 'false',
        shape: tile ? 'display:block; width: 24px; height: 18px; border-radius: 3px;' : 'display:block; width: 20px; height: 20px; border-radius: 999px;',
        ring: on ? 'box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #243b49;' : 'box-shadow: 0 0 0 1px #b9b9bd;',
        pick: function () { self.setState({ sel: i }); }
      };
    });
    var more = item.more || (colors.length > 4 ? '+' + (colors.length - 4) : '');
    return {
      item: Object.assign({}, item, { more: more }),
      yes: true, no: false,
      tile: tile,
      hasTag: !!item.tag,
      hasMore: !!more,
      hasColors: colors.length > 1,
      singleColor: colors.length === 1,
      swatches: swatches,
      color: colors.length ? colors[sel].hex : '#ffffff',
      colorName: colors.length ? colors[sel].name : '',
      rootStyle: tile ? 'position: relative; background: #ffffff; padding-bottom: 20px;' : 'position: relative;',
      mediaStyle: tile ? 'aspect-ratio: 1 / 1; background: #ffffff;' : 'aspect-ratio: 1 / 1; border-radius: 14px; background: #f6f2ee;',
      bodyStyle: tile ? 'padding: 4px 20px 0;' : '',
      titleSize: large || tile ? '16px' : '14px',
      priceSize: large || tile ? '22px' : '18px'
    };
  }
}
</script>
