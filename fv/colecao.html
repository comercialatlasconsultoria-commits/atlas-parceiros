<body data-pagina="colecao" data-titulo="2 · Coleção">

<template id="fv-tpl-Colecao">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}

</helmet>
<div style="font-family: var(--font-brand); color: #243b49; background: #ffffff; min-width: 320px;">

<!-- Faixa rolante -->
<div style="background: #243b49; color: #ffffff; overflow: hidden; height: 38px; display: flex; align-items: center;">
  <div class="fv-marquee-track" style="display: flex; gap: 56px; white-space: nowrap; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding-left: 56px;">
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
  </div>
</div>

<!-- Header -->
<header style="border-bottom: 1px solid #e8e1de; background: #ffffff;">
  <div style="max-width: none; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px;">
    <button aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <a href="home.html" style="display: flex; align-items: center;"><img src="assets/logo-horizontal.svg" alt="FV Enxovais — início" style="height: 44px; width: auto; display: block;"></a>
    <nav style="flex: 999 1 520px; display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 500;">
      <a href="colecao.html" aria-current="page" style="text-decoration: none; padding: 10px 0; border-bottom: 2px solid #806375;">Cama</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Travesseiros</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Mantas e Cobertores</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Tapetes e Decoração</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Kids</a>
      <a href="#" style="text-decoration: none; padding: 10px 0; color: #806375; font-weight: 700;">Kits e Ofertas</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
      <button aria-label="Buscar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
      <button aria-label="Carrinho" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg></button>
    </div>
  </div>
</header>

<!-- Capa da coleção -->
<section style="position: relative; background: #efe4e2; overflow: hidden;">
  <img src="assets/symbol.svg" alt="" aria-hidden="true" style="position: absolute; right: -4%; top: -30%; width: 40%; max-width: 520px; opacity: 0.10;">
  <span style="position: absolute; right: 24px; bottom: 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 10px;">Foto de capa · cama montada em plano aberto</span>
  <div style="position: relative; max-width: none; margin: 0 auto; padding: 20px 24px 56px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 13px; color: #55687a; display: flex; gap: 8px;"><a href="home.html" style="color: #55687a;">Início</a><span aria-hidden="true">/</span><span style="color: #243b49;">Cama</span></div>
    <h1 style="margin: 24px 0 0; font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em;">Jogos de cama</h1>
    <p style="margin: 0; max-width: 560px; font-size: 16px; line-height: 1.6; color: #3b4f5c;">Do Casal ao King, com medida certa para o seu colchão e cores que combinam com o resto do quarto.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
      <sc-for list="{{subcats}}" as="s" hint-placeholder-count="5">
        <a href="#" style="text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #ffffff; font-size: 14px; font-weight: 500; color: #243b49;">{{s}}</a>
      </sc-for>
    </div>
  </div>
</section>

<!-- Barra de filtros -->
<section style="max-width: none; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid #e8e1de;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: #55687a; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px;">Tamanho</span>
      <sc-for list="{{sizeFilters}}" as="f" hint-placeholder-count="4">
        <button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; font-family: inherit; font-size: 14px; cursor: pointer; {{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
      <span style="font-size: 13px; font-weight: 600; color: #55687a; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 8px;">Cor</span>
      <sc-for list="{{colorFilters}}" as="c" hint-placeholder-count="6">
        <button aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: {{c.hex}}; {{c.ring}}"></span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: #55687a; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px;">Ofertas</span>
      <button aria-pressed="{{promoPressed}}" onClick="{{togglePromo}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; font-family: inherit; font-size: 14px; cursor: pointer; {{promoStyle}}">Em promoção</button>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <label for="ordem" style="font-size: 14px; color: #55687a;">Ordenar</label>
      <select id="ordem" onChange="{{onSort}}" style="min-height: 40px; padding: 0 12px; border: 1.5px solid #788fa1; border-radius: 8px; background: #ffffff; font-family: inherit; font-size: 14px; color: #243b49;">
        <option value="rel">Mais vendidos</option>
        <option value="asc">Menor preço</option>
        <option value="desc">Maior preço</option>
      </select>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;">
    <span style="font-size: 14px; color: #55687a;">{{countLabel}}</span>
    <sc-if value="{{hasFilters}}" hint-placeholder-val="{{no}}">
      <button onClick="{{clearFilters}}" style="border: 0; background: transparent; padding: 8px 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #806375; cursor: pointer; text-decoration: underline;">Limpar filtros</button>
    </sc-if>
  </div>
</section>

<!-- Grade -->
<section style="background: #f5f2ee; padding: 12px 12px 96px;">
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px;">
    <sc-for list="{{firstRow}}" as="p" hint-placeholder-count="3">
      <dc-import name="ProductCard" item="{{p}}" tile="{{yes}}" hint-size="100%,620px"></dc-import>
    </sc-for>
    <sc-if value="{{showTile}}" hint-placeholder-val="{{yes}}">
      <a href="#" style="text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; height: 100%; min-height: 420px; padding: 32px 28px; box-sizing: border-box; background: #243b49; color: #ffffff;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #e7c8c6;">Guia rápido</span>
        <span style="display: flex; flex-direction: column; gap: 14px;">
          <span style="font-size: 28px; line-height: 1.15; font-weight: 600;">Qual é o tamanho da sua cama?</span>
          <span style="font-size: 15px; line-height: 1.6; color: #d7e0e6;">Casal, Queen ou King: veja as medidas de cada um e a altura de colchão que o lençol aceita.</span>
        </span>
        <span style="font-size: 15px; font-weight: 600; color: #ffffff;">Ver o guia de medidas →</span>
      </a>
    </sc-if>
    <sc-for list="{{rest}}" as="p" hint-placeholder-count="5">
      <dc-import name="ProductCard" item="{{p}}" tile="{{yes}}" hint-size="100%,620px"></dc-import>
    </sc-for>
  </div>
  <sc-if value="{{empty}}" hint-placeholder-val="{{no}}">
    <div style="padding: 64px 0; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center;">
      <b style="font-size: 20px;">Nenhum jogo com esses filtros</b>
      <span style="font-size: 15px; color: #55687a;">Tente outra cor ou outro tamanho.</span>
      <button class="fv-btn fv-btn--secondary" onClick="{{clearFilters}}" style="font-family: inherit;">Limpar filtros</button>
    </div>
  </sc-if>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 56px;">
    <span style="font-size: 14px; color: #55687a;">{{shownLabel}}</span>
    <button class="fv-btn fv-btn--secondary" style="font-family: inherit; min-width: 240px;">Carregar mais</button>
  </div>
</section>

<footer style="background: #243b49; color: #d7e0e6; padding: 32px 24px; font-size: 12px; text-align: center;">© 2026 FV Enxovais · rodapé completo como na home</footer>

</div>
</template>
<script type="text/plain" id="fv-js-Colecao">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: -1, color: -1, promo: false, sort: 'rel' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var C = [
      { key: 'blush', name: 'Rosa Blush', hex: '#e7c8c6' },
      { key: 'areia', name: 'Areia', hex: '#c7b9b0' },
      { key: 'bebe', name: 'Azul Bebê', hex: '#a9cfe6' },
      { key: 'branco', name: 'Branco', hex: '#ffffff' },
      { key: 'cinza', name: 'Cinza', hex: '#b9b9bd' },
      { key: 'marinho', name: 'Marinho', hex: '#243b49' },
      { key: 'salvia', name: 'Verde Sálvia', hex: '#a9b8a0' }
    ];
    function col(k) { return C.filter(function (c) { return c.key === k; })[0]; }
    function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
    var SIZES = ['Solteiro', 'Casal', 'Queen', 'King'];
    var base = [
      { name: 'Jogo de Cama Queen 4 Peças Toque de Seda', rating: '4,8', reviews: '312', c: ['blush', 'areia', 'bebe', 'branco', 'marinho'], s: [1, 2, 3], price: 189.9, old: 249.9, tag: 'Mais vendido', tagClass: 'fv-badge--best' },
      { name: 'Jogo de Cama Casal 3 Peças Percal', rating: '4,6', reviews: '76', c: ['branco', 'areia', 'bebe'], s: [1, 2], price: 149.9, old: 0, tag: '', tagClass: '' },
      { name: 'Jogo de Cama King 4 Peças Toque de Seda', rating: '4,8', reviews: '121', c: ['areia', 'cinza', 'marinho'], s: [3], price: 219.9, old: 289.9, tag: '-24%', tagClass: 'fv-badge--promo' },
      { name: 'Jogo de Cama Solteiro 2 Peças Malha', rating: '4,7', reviews: '64', c: ['bebe', 'blush', 'cinza'], s: [0], price: 79.9, old: 0, tag: 'Novo', tagClass: 'fv-badge--new' },
      { name: 'Jogo de Cama Queen 4 Peças Estampado Floral', rating: '4,5', reviews: '29', c: ['blush', 'salvia'], s: [2], price: 169.9, old: 199.9, tag: 'Queima de estoque', tagClass: 'fv-badge--promo' },
      { name: 'Jogo de Cama Casal 4 Peças Toque de Seda', rating: '4,8', reviews: '187', c: ['blush', 'areia', 'branco', 'salvia'], s: [1], price: 169.9, old: 229.9, tag: '', tagClass: '' },
      { name: 'Jogo de Cama King 3 Peças Percal', rating: '4,6', reviews: '42', c: ['branco', 'cinza'], s: [3], price: 189.9, old: 0, tag: '', tagClass: '' },
      { name: 'Jogo de Cama Queen 3 Peças Malha', rating: '4,6', reviews: '51', c: ['cinza', 'marinho', 'salvia'], s: [2], price: 129.9, old: 0, tag: 'Últimas unidades', tagClass: 'fv-badge--low' },
      { name: 'Jogo de Cama Solteiro 3 Peças Kids Estampado', rating: '4,9', reviews: '38', c: ['bebe', 'blush'], s: [0], price: 89.9, old: 0, tag: '', tagClass: '' }
    ];
    var list = base.filter(function (p) {
      if (st.size >= 0 && p.s.indexOf(st.size) < 0) return false;
      if (st.color >= 0 && p.c.indexOf(C[st.color].key) < 0) return false;
      if (st.promo && !p.old) return false;
      return true;
    });
    if (st.sort === 'asc') list = list.slice().sort(function (a, b) { return a.price - b.price; });
    if (st.sort === 'desc') list = list.slice().sort(function (a, b) { return b.price - a.price; });
    var items = list.map(function (p) {
      var cs = p.c.map(col);
      var installments = p.price >= 150 ? 6 : 3;
      return {
        name: p.name, rating: p.rating, reviews: p.reviews,
        colors: cs.map(function (c) { return { name: c.name, hex: c.hex }; }), more: '',
        old: p.old ? brl(p.old) : '', price: brl(p.price),
        pix: brl(Math.floor(p.price * 0.95 * 100) / 100),
        inst: installments + 'x de ' + brl(Math.ceil(p.price / installments * 100) / 100),
        tag: p.tag, tagClass: p.tagClass
      };
    });
    var sizeFilters = SIZES.map(function (l, i) {
      var on = i === st.size;
      return { label: l, pressed: on ? 'true' : 'false', style: on ? 'background:#243b49;color:#ffffff;border:1.5px solid #243b49;font-weight:600;' : 'background:#ffffff;color:#243b49;border:1.5px solid #788fa1;', pick: function () { self.setState({ size: on ? -1 : i }); } };
    });
    var colorFilters = C.map(function (c, i) {
      var on = i === st.color;
      return { name: c.name, hex: c.hex, pressed: on ? 'true' : 'false', ring: on ? 'box-shadow:0 0 0 2px #ffffff,0 0 0 4px #806375;' : 'box-shadow:0 0 0 1px #788fa1;', pick: function () { self.setState({ color: on ? -1 : i }); } };
    });
    var n = items.length;
    return {
      yes: true, no: false,
      subcats: ['Todos', 'Toque de Seda', 'Percal', 'Malha', 'Estampados', 'Kids'],
      sizeFilters: sizeFilters, colorFilters: colorFilters,
      promoPressed: st.promo ? 'true' : 'false',
      promoStyle: st.promo ? 'background:#243b49;color:#ffffff;border:1.5px solid #243b49;font-weight:600;' : 'background:#ffffff;color:#243b49;border:1.5px solid #788fa1;',
      togglePromo: function () { self.setState({ promo: !st.promo }); },
      onSort: function (e) { self.setState({ sort: e.target.value }); },
      hasFilters: st.size >= 0 || st.color >= 0 || st.promo,
      clearFilters: function () { self.setState({ size: -1, color: -1, promo: false }); },
      countLabel: n + (n === 1 ? ' produto' : ' produtos'),
      shownLabel: 'Mostrando ' + n + ' de ' + n,
      firstRow: items.slice(0, 2),
      showTile: n > 0,
      rest: items.slice(2),
      empty: n === 0
    };
  }
}
</script>
<template id="fv-tpl-ProductCard">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-brand); color: #243b49; {{rootStyle}}">
  <div style="position: relative;">
  <a href="produto.html" aria-label="{{item.name}}" style="position: relative; display: block; overflow: hidden; text-decoration: none; {{mediaStyle}}">
    <div style="position: absolute; left: 16%; right: 16%; top: 36%; height: 17%; border-radius: 10px; background: {{color}}; box-shadow: 0 1px 0 rgba(36,59,73,0.10), 0 10px 22px rgba(36,59,73,0.10); opacity: 0.85;"></div>
    <div style="position: absolute; left: 13%; right: 13%; top: 49%; height: 19%; border-radius: 10px; background: {{color}}; box-shadow: 0 1px 0 rgba(36,59,73,0.12), 0 14px 28px rgba(36,59,73,0.12);"></div>
    <sc-if value="{{hasTag}}" hint-placeholder-val="{{yes}}">
      <span class="fv-badge {{item.tagClass}}" style="position: absolute; top: 12px; left: 12px;">{{item.tag}}</span>
    </sc-if>
  </a>
  <sc-if value="{{tile}}" hint-placeholder-val="{{no}}">
    <button aria-label="Adicionar {{item.name}} ao carrinho" style="position: absolute; z-index: 2; right: 14px; bottom: 14px; width: 44px; height: 44px; border: 0; border-radius: 8px; background: #243b49; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg></button>
  </sc-if>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px; {{bodyStyle}}">
    <div style="min-height: 28px; display: flex; align-items: center;">
      <sc-if value="{{hasColors}}" hint-placeholder-val="{{yes}}">
        <div style="display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden;">
          <sc-for list="{{swatches}}" as="s" hint-placeholder-count="4">
            <button aria-label="{{s.name}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="width: 30px; height: 30px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <span style="background: {{s.hex}}; {{s.shape}} {{s.ring}}"></span>
            </button>
          </sc-for>
          <sc-if value="{{hasMore}}" hint-placeholder-val="{{yes}}">
            <span style="font-size: 13px; color: #243b49; margin-left: 2px; white-space: nowrap;">{{item.more}}</span>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{singleColor}}" hint-placeholder-val="{{no}}">
        <span style="font-size: 12px; color: #55687a;">Cor única · {{colorName}}</span>
      </sc-if>
    </div>
    <a href="produto.html" style="text-decoration: none; color: #243b49; font-size: {{titleSize}}; line-height: 1.4; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em;">{{item.name}}</a>
    <a href="produto.html#avaliacoes" style="display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; color: #243b49;">
      <span aria-label="Nota {{item.rating}} de 5" style="color: #806375; letter-spacing: 1px; font-size: 14px;">★★★★★</span>
      <span>{{item.reviews}} avaliações</span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; line-height: 18px; min-height: 18px; color: #55687a; text-decoration: line-through;">{{item.old}}</span>
      <span style="font-size: {{priceSize}}; line-height: 1.2; font-weight: 700; color: #243b49;">{{item.price}}</span>
      <span style="font-size: 13px; color: #243b49;"><b>{{item.pix}}</b> no Pix</span>
      <span style="font-size: 13px; color: #55687a;">ou <b style="color: #243b49;">{{item.inst}}</b> sem juros</span>
    </div>
  </div>
</div>
</template>
<script type="text/plain" id="fv-js-ProductCard">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    var self = this;
    var item = this.props.item || {
      name: 'Jogo de Cama Queen 4 Peças Toque de Seda', rating: '4,8', reviews: '312',
      colors: [{ name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Areia', hex: '#c7b9b0' }, { name: 'Azul Bebê', hex: '#a9cfe6' }, { name: 'Marinho', hex: '#243b49' }],
      more: '+3', old: 'R$ 249,90', price: 'R$ 189,90', pix: 'R$ 180,40', inst: '6x de R$ 31,65', tag: 'Mais vendido', tagClass: 'fv-badge--best'
    };
    var colors = item.colors || [];
    var sel = Math.min(this.state.sel, Math.max(colors.length - 1, 0));
    var large = this.props.large ?? false;
    var tile = this.props.tile ?? false;
    var swatches = colors.slice(0, 4).map(function (c, i) {
      var on = i === sel;
      return {
        name: c.name,
        hex: c.hex,
        pressed: on ? 'true' : 'false',
        shape: tile ? 'display:block; width: 24px; height: 18px; border-radius: 3px;' : 'display:block; width: 20px; height: 20px; border-radius: 999px;',
        ring: on ? 'box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #243b49;' : 'box-shadow: 0 0 0 1px #b9b9bd;',
        pick: function () { self.setState({ sel: i }); }
      };
    });
    var more = item.more || (colors.length > 4 ? '+' + (colors.length - 4) : '');
    return {
      item: Object.assign({}, item, { more: more }),
      yes: true, no: false,
      tile: tile,
      hasTag: !!item.tag,
      hasMore: !!more,
      hasColors: colors.length > 1,
      singleColor: colors.length === 1,
      swatches: swatches,
      color: colors.length ? colors[sel].hex : '#ffffff',
      colorName: colors.length ? colors[sel].name : '',
      rootStyle: tile ? 'position: relative; background: #ffffff; padding-bottom: 20px;' : 'position: relative;',
      mediaStyle: tile ? 'aspect-ratio: 1 / 1; background: #ffffff;' : 'aspect-ratio: 1 / 1; border-radius: 14px; background: #f6f2ee;',
      bodyStyle: tile ? 'padding: 4px 20px 0;' : '',
      titleSize: large || tile ? '16px' : '14px',
      priceSize: large || tile ? '22px' : '18px'
    };
  }
}
