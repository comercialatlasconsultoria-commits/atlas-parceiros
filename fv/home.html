<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FV Enxovais · 1 · Home</title>
<link rel="icon" href="assets/symbol.svg">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>#fv-root{min-height:100vh}</style>
</head>
<body data-pagina="home" data-titulo="1 · Home">
<div id="fv-root"></div>
<template id="fv-tpl-Main">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#243b49}a:hover{color:#806375}
@keyframes fvmarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.fv-marquee-track{animation:fvmarquee 28s linear infinite}
.fv-marquee-track:hover{animation-play-state:paused}
.fv-hscroll{scrollbar-width:none}
.fv-hscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="font-family: var(--font-brand); color: #243b49; background: #ffffff; min-width: 320px;">

<!-- 1. Faixa rolante -->
<div style="background: #243b49; color: #ffffff; overflow: hidden; height: 38px; display: flex; align-items: center;">
  <div class="fv-marquee-track" style="display: flex; gap: 56px; white-space: nowrap; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding-left: 56px;">
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
    <span>Frete grátis: R$ 199 no Sul e Sudeste, R$ 249 nas demais regiões</span><span>5% off no Pix</span><span>Até 6x sem juros</span><span>Direto da fábrica em Ibitinga, SP</span><span>Troca fácil</span>
  </div>
</div>

<!-- 2. Header -->
<header style="border-bottom: 1px solid #e8e1de; background: #ffffff;">
  <div style="max-width: none; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px;">
    <button aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <a href="#" style="display: flex; align-items: center;"><img src="assets/logo-horizontal.svg" alt="FV Enxovais" style="height: 44px; width: auto; display: block;"></a>
    <nav style="flex: 999 1 520px; display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 500;">
      <a href="colecao.html" style="text-decoration: none; padding: 10px 0;">Cama</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Travesseiros</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Mantas e Cobertores</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Tapetes e Decoração</a>
      <a href="#" style="text-decoration: none; padding: 10px 0;">Kids</a>
      <a href="#" style="text-decoration: none; padding: 10px 0; color: #806375; font-weight: 700;">Kits e Ofertas</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
      <button aria-label="Buscar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
      <button aria-label="Minha conta" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.4-3.6 4.2-5.2 7.5-5.2s6.1 1.6 7.5 5.2"></path></svg></button>
      <button aria-label="Carrinho, 0 itens" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg></button>
    </div>
  </div>
</header>

<!-- 3. Full banner em vídeo -->
<section style="position: relative; background: #e9ded6; min-height: 620px; display: flex; align-items: flex-end; overflow: hidden;">
  <img src="assets/symbol.svg" alt="" aria-hidden="true" style="position: absolute; right: -6%; top: -10%; width: 58%; max-width: 760px; opacity: 0.10;">
  <div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.88); border-radius: 999px; padding: 8px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #243b49;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
    Vídeo de fundo · cama montada, sol da manhã entrando pela janela
  </div>
  <div style="position: relative; width: 100%; max-width: none; margin: 0 auto; padding: 56px 24px 64px; box-sizing: border-box;">
    <div style="max-width: 600px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6a5162;">Nova coleção</span>
      <h1 style="margin: 0; font-size: 56px; line-height: 1.02; font-weight: 600; letter-spacing: -0.02em;">Levando conforto para o seu lar</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #3b4f5c;">Enxoval feito na nossa fábrica em Ibitinga, com o toque macio que você sente já na primeira noite.</p>
      <a href="#colecao" class="fv-btn fv-btn--primary" style="text-decoration: none;">Conhecer a coleção</a>
    </div>
  </div>
</section>

<!-- 4. Produtos do vídeo -->
<section id="colecao" style="padding: 56px 24px 72px;">
  <div style="max-width: none; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;">
      <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Compre o que está no vídeo</h2>
      <a href="#" style="font-size: 15px; font-weight: 600; color: #806375;">Ver a coleção completa →</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px;">
      <sc-for list="{{heroProducts}}" as="p" hint-placeholder-count="3">
        <dc-import name="ProductCard" item="{{p}}" large="{{yes}}" hint-size="100%,720px"></dc-import>
      </sc-for>
    </div>
  </div>
</section>

<!-- 5. Categorias -->
<section style="padding: 0 24px 80px;">
  <div style="max-width: none; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
    <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Compre por categoria</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px;">
      <sc-for list="{{categories}}" as="c" hint-placeholder-count="6">
        <a href="colecao.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 12px;">
          <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: {{c.bg}}; display: flex; align-items: center; justify-content: center;">
            <img src="assets/symbol.svg" alt="" aria-hidden="true" style="width: 34%; opacity: 0.16;">
            <span style="position: absolute; left: 10px; bottom: 10px; right: 10px; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49;">{{c.shot}}</span>
          </div>
          <span style="font-size: 16px; font-weight: 600; color: #243b49;">{{c.name}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</section>

<!-- 6. Quem usa, ama (social commerce) -->
<section style="padding: 72px 0; background: #fbf6f5;">
  <div style="max-width: none; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
    <div style="padding: 0 24px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Quem usa, ama</h2>
        <p style="margin: 0; font-size: 15px; color: #55687a;">Vídeos de clientes e parceiras, direto do nosso Instagram.</p>
      </div>
      <a href="#" style="font-size: 15px; font-weight: 600; color: #806375;">Seguir @fvenxovais →</a>
    </div>
    <div class="fv-hscroll" style="display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 16px; overflow-x: auto; padding: 0 24px 4px; scroll-snap-type: x mandatory;">
      <sc-for list="{{videos}}" as="v" hint-placeholder-count="5">
        <div style="min-width: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px;">
          <div style="position: relative; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: {{v.bg}}; display: flex; align-items: center; justify-content: center;">
            <img src="assets/symbol.svg" alt="" aria-hidden="true" style="width: 40%; opacity: 0.14;">
            <span style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 999px; padding: 5px 10px;">{{v.handle}}</span>
            <button aria-label="Assistir vídeo" style="position: absolute; width: 52px; height: 52px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.92); color: #243b49; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
            <span style="position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 8px;">{{v.shot}}</span>
          </div>
          <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; background: #ffffff; border-radius: 12px; padding: 8px; border: 1px solid #e8e1de;">
            <span style="width: 44px; height: 44px; border-radius: 8px; background: {{v.productColor}}; flex: none;"></span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 12px; line-height: 16px; color: #243b49; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{v.product}}</span>
              <span style="font-size: 14px; font-weight: 700; color: #243b49;">{{v.price}}</span>
            </span>
          </a>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<!-- 7. Mais vendidos com abas -->
<section style="padding: 80px 24px;">
  <div style="max-width: none; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px;">
      <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Mais vendidos</h2>
      <div role="tablist" aria-label="Categorias dos mais vendidos" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; {{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px;">
      <sc-for list="{{bestSellers}}" as="p" hint-placeholder-count="3">
        <dc-import name="ProductCard" item="{{p}}" large="{{yes}}" hint-size="100%,660px"></dc-import>
      </sc-for>
    </div>
  </div>
</section>

<!-- 8. Compre o ambiente -->
<section style="padding: 80px 24px; background: #ecf7fd;">
  <div style="max-width: none; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6a5162;">Compre o ambiente</span>
      <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Manhã em rosa blush</h2>
      <p style="margin: 0; font-size: 15px; color: #4e6170;">Toque no + para ver cada peça, ou leve o quarto inteiro de uma vez.</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch;">
      <div style="flex: 999 1 560px; min-width: 0; position: relative; aspect-ratio: 4 / 3; border-radius: 24px; overflow: hidden; background: #ead8d6;">
        <img src="assets/symbol.svg" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -50%); opacity: 0.12;">
        <span style="position: absolute; left: 14px; top: 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 10px;">Foto do quarto montado · luz da manhã</span>
        <sc-for list="{{scene}}" as="s" hint-placeholder-count="3">
          <button aria-label="{{s.aria}}" onClick="{{s.pick}}" style="position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 999px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; font-size: 24px; line-height: 1; {{s.dotStyle}}">+</button>
        </sc-for>
      </div>
      <div style="flex: 1 1 340px; background: #ffffff; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-size: 14px; color: #55687a;">Tamanho da cama: <b style="color: #243b49;">{{sceneSizeLabel}}</b></span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <sc-for list="{{sceneSizes}}" as="z" hint-placeholder-count="3">
              <button class="fv-chip" aria-pressed="{{z.pressed}}" onClick="{{z.pick}}" style="font-family: inherit;">{{z.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column;">
          <sc-for list="{{scene}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; {{s.rowStyle}}">
              <span style="width: 48px; height: 48px; border-radius: 10px; background: {{s.color}}; flex: none;"></span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;">
                <span style="font-size: 14px; font-weight: 600; color: #243b49;">{{s.name}}</span>
                <span style="font-size: 12px; color: #55687a;">{{s.variant}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                <span style="font-size: 15px; font-weight: 700; color: #243b49;">{{s.price}}</span>
                <a href="#" style="font-size: 12px; font-weight: 600; color: #806375;">Ver peça</a>
              </span>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #e8e1de; padding-top: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; color: #55687a;">Ambiente completo</span>
            <span style="font-size: 22px; font-weight: 700;">{{sceneTotal}}</span>
          </div>
          <span style="font-size: 13px; color: #55687a;">ou <b style="color: #243b49;">{{sceneInst}}</b> sem juros · <b style="color: #243b49;">{{scenePix}}</b> no Pix</span>
          <button class="fv-btn fv-btn--primary fv-btn--block" style="font-family: inherit;">Comprar o ambiente completo</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 9. Segundo banner + 2 produtos -->
<section style="position: relative; background: #d9cfc8; min-height: 520px; display: flex; align-items: center; overflow: hidden;">
  <img src="assets/symbol.svg" alt="" aria-hidden="true" style="position: absolute; left: -8%; bottom: -20%; width: 46%; max-width: 620px; opacity: 0.10;">
  <div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.88); border-radius: 999px; padding: 8px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #243b49;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
    Vídeo · manta sobre a cama, fim de tarde, luz quente
  </div>
  <div style="position: relative; width: 100%; max-width: none; margin: 0 auto; padding: 64px 24px; box-sizing: border-box; display: flex; justify-content: flex-end;">
    <div style="max-width: 480px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6a5162;">Coleção Inverno</span>
      <h2 style="margin: 0; font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em;">Noites frias pedem manta macia</h2>
      <a href="#" class="fv-btn fv-btn--primary" style="text-decoration: none;">Ver mantas e coberdrons</a>
    </div>
  </div>
</section>
<section style="padding: 56px 24px 80px;">
  <div style="max-width: none; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px;">
    <sc-for list="{{winterProducts}}" as="p" hint-placeholder-count="3">
      <dc-import name="ProductCard" item="{{p}}" large="{{yes}}" hint-size="100%,720px"></dc-import>
    </sc-for>
  </div>
</section>

<!-- 10. Produto em destaque (bloco editorial) -->
<section style="padding: 0 24px 88px;">
  <div style="max-width: none; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0; border-radius: 24px; overflow: hidden; background: #fbf6f5;">
    <div style="position: relative; min-height: 520px; background: #e7dcd7; display: flex; align-items: center; justify-content: center;">
      <img src="assets/symbol.svg" alt="" aria-hidden="true" style="width: 34%; opacity: 0.14;">
      <span style="position: absolute; left: 14px; bottom: 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #243b49; background: rgba(255,255,255,0.88); border-radius: 8px; padding: 6px 10px;">Foto editorial · mão afundando no travesseiro, close de textura</span>
    </div>
    <div style="padding: 56px 48px; display: flex; flex-direction: column; gap: 20px; justify-content: center; box-sizing: border-box;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6a5162;">Em destaque</span>
      <h2 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 600;">Travesseiro Softy: do seu jeito de dormir</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3b4f5c;">Escolha o suporte e o tamanho que combinam com você. Enchimento em fibra de silicone, macio por fora e firme onde precisa.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <span style="border: 1.5px solid #788fa1; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500;">Suporte médio ou firme</span>
        <span style="border: 1.5px solid #788fa1; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500;">50 × 70 ou 50 × 90 cm</span>
        <span style="border: 1.5px solid #788fa1; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500;">Fibra de silicone</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
        <a href="#" class="fv-btn fv-btn--primary" style="text-decoration: none;">Conhecer o Softy</a>
        <span style="font-size: 14px; color: #55687a;">a partir de <b style="color: #243b49;">R$ 69,90</b></span>
      </div>
    </div>
  </div>
</section>

<!-- 11. Selo / argumentos -->
<section style="padding: 0 24px 88px;">
  <div style="max-width: none; margin: 0 auto;">
    <div class="fv-trust">
      <div class="fv-trust__item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"></path><circle cx="7" cy="17.5" r="1.6"></circle><circle cx="17.5" cy="17.5" r="1.6"></circle></svg><span><b>Frete grátis</b>R$ 199 Sul/Sudeste · R$ 249 demais</span></div>

<script type="text/plain" id="fv-js-ProductCard">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    var self = this;
    var item = this.props.item || {
      name: 'Jogo de Cama Queen 4 Peças Toque de Seda', rating: '4,8', reviews: '312',
      colors: [{ name: 'Rosa Blush', hex: '#e7c8c6' }, { name: 'Areia', hex: '#c7b9b0' }, { name: 'Azul Bebê', hex: '#a9cfe6' }, { name: 'Marinho', hex: '#243b49' }],
      more: '+3', old: 'R$ 249,90', price: 'R$ 189,90', pix: 'R$ 180,40', inst: '6x de R$ 31,65', tag: 'Mais vendido', tagClass: 'fv-badge--best'
    };
    var colors = item.colors || [];
    var sel = Math.min(this.state.sel, Math.max(colors.length - 1, 0));
    var large = this.props.large ?? false;
    var tile = this.props.tile ?? false;
    var swatches = colors.slice(0, 4).map(function (c, i) {
      var on = i === sel;
      return {
        name: c.name,
        hex: c.hex,
        pressed: on ? 'true' : 'false',
        shape: tile ? 'display:block; width: 24px; height: 18px; border-radius: 3px;' : 'display:block; width: 20px; height: 20px; border-radius: 999px;',
        ring: on ? 'box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #243b49;' : 'box-shadow: 0 0 0 1px #b9b9bd;',
        pick: function () { self.setState({ sel: i }); }
      };
    });
    var more = item.more || (colors.length > 4 ? '+' + (colors.length - 4) : '');
    return {
      item: Object.assign({}, item, { more: more }),
      yes: true, no: false,
      tile: tile,
      hasTag: !!item.tag,
      hasMore: !!more,
      hasColors: colors.length > 1,
      singleColor: colors.length === 1,
      swatches: swatches,
      color: colors.length ? colors[sel].hex : '#ffffff',
      colorName: colors.length ? colors[sel].name : '',
      rootStyle: tile ? 'position: relative; background: #ffffff; padding-bottom: 20px;' : 'position: relative;',
      mediaStyle: tile ? 'aspect-ratio: 1 / 1; background: #ffffff;' : 'aspect-ratio: 1 / 1; border-radius: 14px; background: #f6f2ee;',

}
</script>
