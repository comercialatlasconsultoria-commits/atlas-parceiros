<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FV Enxovais · 5.2 · Celular · Coleção</title>
<link rel="icon" href="assets/symbol.svg">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>html,body{height:100%}#fv-root{height:100%}</style>
</head>
<body data-pagina="m-colecao" data-titulo="5.2 · Celular · Coleção">
<div id="fv-root"></div>
<template id="fv-tpl-MobileColecao">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#243b49}
@keyframes fvup{from{transform:translateY(100%)}to{transform:none}}
.fv-up{animation:fvup .26s ease-out}
.fv-hs{scrollbar-width:none}
.fv-hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #ffffff; font-family: var(--font-brand); color: #243b49;">
<div class="fv-hs" style="height: 100%; overflow-y: auto;">

  <header style="position: sticky; top: 0; z-index: 5; background: #ffffff; border-bottom: 1px solid #e8e1de; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px;">
    <a href="m-home.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <a href="m-home.html" style="display: flex;"><img src="assets/logo-horizontal.svg" alt="FV Enxovais" style="height: 34px; width: auto;"></a>
    <button aria-label="Carrinho" style="width: 44px; height: 44px; border: 0; background: transparent; color: #243b49; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7Z"></path><path d="M9 7V6a3 3 0 0 1 6 0v1"></path></svg></button>
  </header>

  <section style="background: #efe4e2; padding: 24px 20px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; color: #55687a;">Início / Cama</span>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.08; font-weight: 600;">Jogos de cama</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #3b4f5c;">Do Casal ao King, com medida certa para o seu colchão.</p>
  </section>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px;">
    <sc-for list="{{subcats}}" as="s" hint-placeholder-count="5">
      <a href="#" style="flex: none; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1.5px solid #788fa1; font-size: 13px;">{{s}}</a>
    </sc-for>
  </div>

  <!-- Barra de filtros fixa -->
  <div style="position: sticky; top: 57px; z-index: 4; background: #ffffff; display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-top: 1px solid #e8e1de; border-bottom: 1px solid #e8e1de;">
    <button onClick="{{openFilters}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #243b49; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #243b49; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      Filtrar e ordenar{{filterBadge}}
    </button>
    <span style="font-size: 13px; color: #55687a; flex: 1;">{{countLabel}}</span>
    <div role="group" aria-label="Produtos por linha" style="display: flex; border: 1.5px solid #788fa1; border-radius: 8px; overflow: hidden;">
      <button aria-label="1 por linha" aria-pressed="{{oneOn}}" onClick="{{setOne}}" style="width: 40px; height: 36px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; {{oneStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
      <button aria-label="2 por linha" aria-pressed="{{twoOn}}" onClick="{{setTwo}}" style="width: 40px; height: 36px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; {{twoStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="2"></rect><rect x="13" y="4" width="8" height="16" rx="2"></rect></svg></button>
    </div>
  </div>

  <!-- Grade -->
  <div style="padding: 20px 20px 48px; display: grid; gap: 36px 14px; {{gridStyle}}">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
      <a href="m-produto.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 8px; color: #243b49; min-width: 0;">
        <span style="position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: #f6f2ee; margin-bottom: 6px;">
          <span style="position: absolute; left: 14%; right: 14%; top: 44%; height: 20%; border-radius: 8px; background: {{p.hex}}; box-shadow: 0 10px 20px rgba(36,59,73,0.12);"></span>
          <sc-if value="{{p.tag}}" hint-placeholder-val="{{no}}"><span class="fv-badge {{p.tagClass}}" style="position: absolute; top: 8px; left: 8px; font-size: 10px; padding: 3px 8px;">{{p.tag}}</span></sc-if>
        </span>
        <span style="line-height: 1.35; min-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; {{p.titleStyle}}">{{p.name}}</span>
        <span style="font-size: 11px; color: #55687a;"><span style="color: #806375;">★★★★★</span> {{p.rating}} ({{p.reviews}})</span>
        <span style="display: flex; gap: 6px; min-height: 14px;"><sc-for list="{{p.dots}}" as="d" hint-placeholder-count="3"><span style="width: 14px; height: 14px; border-radius: 999px; background: {{d}}; box-shadow: 0 0 0 1px #788fa1;"></span></sc-for></span>
        <span style="display: flex; flex-direction: column; gap: 2px; margin-top: 6px;">
          <s style="font-size: 11px; line-height: 15px; min-height: 15px; color: #55687a;">{{p.old}}</s>
          <b style="{{p.priceStyle}}">{{p.price}}</b>
          <span style="font-size: 12px;"><b>{{p.pix}}</b> no Pix</span>
          <span style="font-size: 12px; color: #55687a;">ou <b style="color: #243b49;">{{p.inst}}</b></span>
        </span>
      </a>
    </sc-for>
  </div>
  <sc-if value="{{empty}}" hint-placeholder-val="{{no}}">
    <div style="padding: 0 20px 40px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <b>Nenhum jogo com esses filtros</b>
      <button class="fv-btn fv-btn--secondary" onClick="{{clearFilters}}" style="font-family: inherit;">Limpar filtros</button>
    </div>
  </sc-if>
  <footer style="background: #243b49; color: #d7e0e6; padding: 24px 20px; font-size: 11px;">© 2026 FV Enxovais</footer>
</div>

<!-- Gaveta de filtros -->
<sc-if value="{{filtersOpen}}" hint-placeholder-val="{{no}}">
  <div style="position: absolute; inset: 0; z-index: 20;">
    <button aria-label="Fechar filtros" onClick="{{closeFilters}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(36,59,73,0.45); cursor: pointer;"></button>
    <div class="fv-up" role="dialog" aria-label="Filtrar e ordenar" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; background: #ffffff; border-radius: 22px 22px 0 0; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 12px 20px; border-bottom: 1px solid #e8e1de;">
        <b style="font-size: 17px;">Filtrar e ordenar</b>
        <button aria-label="Fechar" onClick="{{closeFilters}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; color: #243b49; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <b style="font-size: 14px;">Ordenar por</b>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
              <button class="fv-chip" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font-family: inherit;">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <b style="font-size: 14px;">Tamanho</b>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{sizeFilters}}" as="f" hint-placeholder-count="4">
              <button class="fv-chip" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="font-family: inherit; min-width: 0;">{{f.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <b style="font-size: 14px;">Cor <span style="font-weight: 400; color: #55687a;">{{colorLabel}}</span></b>
          <div style="display: flex; flex-wrap: wrap; gap: 4px;">
            <sc-for list="{{colorFilters}}" as="c" hint-placeholder-count="7">
              <button aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;"><span style="width: 30px; height: 30px; border-radius: 999px; background: {{c.hex}}; {{c.ring}}"></span></button>
            </sc-for>
          </div>
        </div>
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 14px; font-weight: 600;">
          Só produtos em promoção
          <input type="checkbox" checked="{{promo}}" onChange="{{togglePromo}}" style="width: 22px; height: 22px; accent-color: #806375;">
        </label>
      </div>
      <div style="display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid #e8e1de;">
        <button class="fv-btn fv-btn--secondary" onClick="{{clearFilters}}" style="font-family: inherit; flex: 1;">Limpar</button>
        <button class="fv-btn fv-btn--primary" onClick="{{closeFilters}}" style="font-family: inherit; flex: 2;">{{seeLabel}}</button>
      </div>
    </div>
  </div>
</sc-if>
</div>
</template>
<script type="text/plain" id="fv-js-MobileColecao">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: -1, color: -1, promo: false, sort: 0, cols: 2, open: false };
  }
  renderVals() {
    var self = this, st = this.state;
    function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
    var C = [
      { key: 'blush', name: 'Rosa Blush', hex: '#e7c8c6' }, { key: 'areia', name: 'Areia', hex: '#c7b9b0' },
      { key: 'bebe', name: 'Azul Bebê', hex: '#a9cfe6' }, { key: 'branco', name: 'Branco', hex: '#ffffff' },
      { key: 'cinza', name: 'Cinza', hex: '#b9b9bd' }, { key: 'marinho', name: 'Marinho', hex: '#243b49' },
      { key: 'salvia', name: 'Verde Sálvia', hex: '#a9b8a0' }
    ];
    function hex(k) { return C.filter(function (c) { return c.key === k; })[0].hex; }
    var SIZES = ['Solteiro', 'Casal', 'Queen', 'King'];
    var base = [
      { name: 'Jogo de Cama Queen 4 Peças Toque de Seda', rating: '4,8', reviews: '312', c: ['blush', 'areia', 'bebe', 'branco', 'marinho'], s: [1, 2, 3], price: 189.9, old: 249.9, tag: 'Mais vendido', tagClass: 'fv-badge--best' },
      { name: 'Jogo de Cama Casal 3 Peças Percal', rating: '4,6', reviews: '76', c: ['branco', 'areia', 'bebe'], s: [1, 2], price: 149.9, old: 0, tag: '', tagClass: '' },
      { name: 'Jogo de Cama King 4 Peças Toque de Seda', rating: '4,8', reviews: '121', c: ['areia', 'cinza', 'marinho'], s: [3], price: 219.9, old: 289.9, tag: '-24%', tagClass: 'fv-badge--promo' },
      { name: 'Jogo de Cama Solteiro 2 Peças Malha', rating: '4,7', reviews: '64', c: ['bebe', 'blush', 'cinza'], s: [0], price: 79.9, old: 0, tag: 'Novo', tagClass: 'fv-badge--new' },
      { name: 'Jogo de Cama Queen 4 Peças Estampado Floral', rating: '4,5', reviews: '29', c: ['blush', 'salvia'], s: [2], price: 169.9, old: 199.9, tag: 'Queima', tagClass: 'fv-badge--promo' },
      { name: 'Jogo de Cama Casal 4 Peças Toque de Seda', rating: '4,8', reviews: '187', c: ['blush', 'areia', 'branco', 'salvia'], s: [1], price: 169.9, old: 229.9, tag: '', tagClass: '' },
      { name: 'Jogo de Cama King 3 Peças Percal', rating: '4,6', reviews: '42', c: ['branco', 'cinza'], s: [3], price: 189.9, old: 0, tag: '', tagClass: '' },
      { name: 'Jogo de Cama Queen 3 Peças Malha', rating: '4,6', reviews: '51', c: ['cinza', 'marinho', 'salvia'], s: [2], price: 129.9, old: 0, tag: 'Últimas', tagClass: 'fv-badge--low' }
    ];
    var list = base.filter(function (p) {
      if (st.size >= 0 && p.s.indexOf(st.size) < 0) return false;
      if (st.color >= 0 && p.c.indexOf(C[st.color].key) < 0) return false;
      if (st.promo && !p.old) return false;
      return true;
    });
    if (st.sort === 1) list = list.slice().sort(function (a, b) { return a.price - b.price; });
    if (st.sort === 2) list = list.slice().sort(function (a, b) { return b.price - a.price; });
    var one = st.cols === 1;
    var items = list.map(function (p) {
      var n = p.price >= 150 ? 6 : 3;
      var col = st.color >= 0 ? C[st.color].key : p.c[0];
      return {
        name: p.name, rating: p.rating, reviews: p.reviews, hex: hex(col), dots: p.c.slice(0, 4).map(hex),
        old: p.old ? brl(p.old) : '', price: brl(p.price), pix: brl(Math.floor(p.price * 95) / 100),
        inst: n + 'x de ' + brl(Math.ceil(p.price / n * 100) / 100), tag: p.tag, tagClass: p.tagClass,
        titleStyle: one ? 'font-size:15px;font-weight:500;' : 'font-size:13px;font-weight:500;',
        priceStyle: one ? 'font-size:20px;' : 'font-size:16px;'
      };
    });
    var active = (st.size >= 0 ? 1 : 0) + (st.color >= 0 ? 1 : 0) + (st.promo ? 1 : 0);
    var on = 'background:#243b49;color:#ffffff;', off = 'background:#ffffff;color:#243b49;';
    return {
      yes: true, no: false,
      subcats: ['Todos', 'Toque de Seda', 'Percal', 'Malha', 'Estampados', 'Kids'],
      items: items, empty: items.length === 0,
      countLabel: items.length + ' produtos',
      filterBadge: active ? ' (' + active + ')' : '',
      gridStyle: one ? 'grid-template-columns: minmax(0, 1fr);' : 'grid-template-columns: repeat(2, minmax(0, 1fr));',
      oneOn: one ? 'true' : 'false', twoOn: one ? 'false' : 'true',
      oneStyle: one ? on : off, twoStyle: one ? off : on,
      setOne: function () { self.setState({ cols: 1 }); },
      setTwo: function () { self.setState({ cols: 2 }); },
      filtersOpen: st.open,
      openFilters: function () { self.setState({ open: true }); },
      closeFilters: function () { self.setState({ open: false }); },
      clearFilters: function () { self.setState({ size: -1, color: -1, promo: false, sort: 0 }); },
      sorts: ['Mais vendidos', 'Menor preço', 'Maior preço'].map(function (l, i) { return { label: l, pressed: i === st.sort ? 'true' : 'false', pick: function () { self.setState({ sort: i }); } }; }),
      sizeFilters: SIZES.map(function (l, i) { var o = i === st.size; return { label: l, pressed: o ? 'true' : 'false', pick: function () { self.setState({ size: o ? -1 : i }); } }; }),
      colorFilters: C.map(function (c, i) { var o = i === st.color; return { name: c.name, hex: c.hex, pressed: o ? 'true' : 'false', ring: o ? 'box-shadow:0 0 0 2px #ffffff,0 0 0 4px #806375;' : 'box-shadow:0 0 0 1px #788fa1;', pick: function () { self.setState({ color: o ? -1 : i }); } }; }),
      colorLabel: st.color >= 0 ? '· ' + C[st.color].name : '',
      promo: st.promo,
      togglePromo: function () { self.setState({ promo: !self.state.promo }); },
      seeLabel: 'Ver ' + items.length + (items.length === 1 ? ' produto' : ' produtos')
    };
  }
}
</script>
<script src="assets/fv-config.js"></script>
<script src="assets/fv-runtime.js"></script>
<script>FVProto.mount("MobileColecao", document.getElementById("fv-root"));</script>
<script src="assets/fv-comentarios.js"></script>
</body>
</html>
